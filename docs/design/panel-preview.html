<title>Panel de Mano</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three panes — nav rail, the owner's working view, and a live line to Mano. Collapses to one column on phones. */
:root{
  --bg:#F2EDE3; --panel:#FBF8F2; --sunk:#EAE3D6; --ink:#1A1916; --muted:#5B564D; --line:#DCD3C4;
  --accent:#A8441F; --accent-ink:#FFFFFF; --accent-soft:#F3DDD2;
  --good:#2E6B45; --good-soft:#DCEBDF; --warn:#8A5A00; --warn-soft:#F4E6C6; --bad:#A3241B; --bad-soft:#F6D9D5;
  --night:#171614; --night-ink:#F2EDE3; --night-muted:#BDB5A6; --night-line:#34302A; --night-accent:#E58A62;
  --f-display:'Fraunces','Iowan Old Style',Georgia,serif;
  --f-body:'Geist','Helvetica Neue',Arial,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12110F; --panel:#1B1916; --sunk:#0E0D0B; --ink:#EFE9DE; --muted:#A8A194; --line:#302C26;
  --accent:#E07A52; --accent-ink:#1A1916; --accent-soft:#3A2419;
  --good:#7CC496; --good-soft:#1C2E22; --warn:#E3B45A; --warn-soft:#33280F; --bad:#F08A80; --bad-soft:#3A1A17;
  --night:#0B0A09; --night-ink:#EFE9DE; --night-muted:#B3AB9C; --night-line:#2C2924; --night-accent:#E58A62;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12110F; --panel:#1B1916; --sunk:#0E0D0B; --ink:#EFE9DE; --muted:#A8A194; --line:#302C26;
  --accent:#E07A52; --accent-ink:#1A1916; --accent-soft:#3A2419;
  --good:#7CC496; --good-soft:#1C2E22; --warn:#E3B45A; --warn-soft:#33280F; --bad:#F08A80; --bad-soft:#3A1A17;
  --night:#0B0A09; --night-ink:#EFE9DE; --night-muted:#B3AB9C; --night-line:#2C2924; --night-accent:#E58A62;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance}
p{margin:0}
.mono{font-family:var(--f-mono)}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:232px minmax(0,1fr) 360px;min-height:100vh;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}

/* nav */
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:4px;padding:20px 14px;border-right:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px;font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.02em}
.brand svg{width:24px;height:24px;stroke:var(--accent)}
.biz{margin:0 6px 14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:13px}
.biz b{display:block;font-weight:600}
.biz span{color:var(--muted)}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 12px;border:0;border-radius:10px;background:transparent;text-align:left;color:var(--muted);font-weight:500}
.navbtn svg{width:18px;height:18px;stroke:currentColor;flex:none}
.navbtn:hover{background:var(--sunk);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--ink);color:var(--bg)}
.navbtn .badge{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:500 12px/22px var(--f-mono);text-align:center}
.navbtn[aria-current="page"] .badge{background:var(--bg);color:var(--ink)}
.rail .spacer{flex:1}
.demo-tag{margin:0 6px;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* main */
.main{min-width:0;padding:28px 32px 60px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.topbar h1{font-family:var(--f-display);font-size:34px;letter-spacing:-.03em;line-height:1.1}
.topbar h1 em{font-style:italic;color:var(--accent)}
.topbar .sub{color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:500;font-size:14px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn svg{width:16px;height:16px;stroke:currentColor}

.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font-family:var(--f-display);font-weight:500;font-size:30px;letter-spacing:-.03em;margin-top:6px}
.stat span{font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--sunk);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;min-width:0}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h2{font-family:var(--f-display);font-size:22px;letter-spacing:-.02em}
.card-h a,.linkbtn{font-size:13px;color:var(--accent);background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}

.brief{display:flex;flex-direction:column;gap:10px}
.brief li{list-style:none;display:flex;gap:12px}
.brief li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-top:8px}
.brief ul{margin:0;padding:0;display:flex;flex-direction:column;gap:10px}

.appr{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.appr + .appr{margin-top:10px}
.appr.alto{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad-soft) 55%,var(--bg))}
.appr-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font:500 11px/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;background:var(--sunk);color:var(--muted)}
.chip.bajo{background:var(--good-soft);color:var(--good)}
.chip.medio{background:var(--warn-soft);color:var(--warn)}
.chip.alto{background:var(--bad-soft);color:var(--bad)}
.chip.on{background:var(--good-soft);color:var(--good)}
.chip.off{background:var(--sunk);color:var(--muted)}
.chip.deleg{background:var(--accent-soft);color:var(--accent)}
.appr b{font-weight:600}
.appr p{color:var(--muted);font-size:14px}
.appr .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}

.mission{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-top:1px solid var(--line)}
.mission:first-of-type{border-top:0;padding-top:0}
.mission .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.mission b{font-weight:600}
.mission .met{font-size:13px;color:var(--muted)}
.lvl{font-family:var(--f-mono);font-size:11px;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}

.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.seg button{border:0;background:transparent;min-height:36px;padding:0 12px;font-size:13px;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.feed{display:flex;flex-direction:column}
.feed .it{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:baseline}
.feed .it:first-child{border-top:0;padding-top:0}
.feed time{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.feed .tx{min-width:0}
.feed .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.feed .cost{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:720px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}

.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.funnel{display:flex;flex-direction:column;gap:10px}
.funnel .f{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:12px;align-items:center;font-size:14px}
.funnel .f .b{height:14px;border-radius:4px;background:var(--accent)}
.funnel .f .v{text-align:right;font-family:var(--f-mono);font-size:13px}
.range{display:flex;flex-direction:column;gap:6px}
.range label{display:flex;justify-content:space-between;font-size:14px}
.range input{width:100%;accent-color:var(--accent)}
.note{font-size:13px;color:var(--muted)}

.conn{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.conn:first-child{border-top:0}
.conn .ic{width:40px;height:40px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:600}
.conn .tx{flex:1;min-width:0}
.conn .tx small{display:block;color:var(--muted);font-size:13px}

.facts{display:flex;flex-direction:column}
.fact{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.fact:first-child{border-top:0}
.fact .k{font-family:var(--f-mono);font-size:12px;color:var(--accent);min-width:110px;padding-top:2px}
.fact .v{flex:1;min-width:0}
.fact button{border:0;background:none;color:var(--muted);min-width:36px;min-height:36px;border-radius:8px}
.fact button:hover{background:var(--sunk);color:var(--bad)}
.addfact{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.addfact input{flex:1 1 160px;min-width:0;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}

/* chat pane */
.chat{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel)}
.chat-h{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:600}
.chat-h b{display:block}
.chat-h small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.chat-h small::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:0}
.msgs{flex:1;overflow-y:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:10px}
.m{max-width:88%;padding:10px 14px;border-radius:16px;font-size:14px;white-space:pre-line}
.m.u{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.typing{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:8px 18px}
.quick button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:13px}
.quick button:hover{border-color:var(--accent);color:var(--accent)}
.compose{display:flex;gap:8px;padding:12px 18px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.compose input{flex:1;min-width:0;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.compose button{min-width:44px;min-height:44px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.compose svg{width:18px;height:18px;stroke:currentColor}

/* call overlay */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--night) 70%,transparent);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.callbox{width:min(400px,100%);background:var(--night);color:var(--night-ink);border:1px solid var(--night-line);border-radius:28px;padding:28px}
.callbox .top{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--night-muted)}
.callbox h2{font-family:var(--f-display);font-size:36px;margin-top:16px}
.callbox p.reason{color:var(--night-muted);margin-top:6px}
.wave{display:flex;align-items:center;gap:4px;height:40px;margin-top:16px}
.wave span{width:4px;border-radius:2px;background:var(--night-accent);height:35%;animation:w 1s ease-in-out infinite}
@keyframes w{50%{height:100%}}
.tscript{margin-top:18px;display:flex;flex-direction:column;gap:12px;font-size:14px;min-height:20px}
.tscript small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--night-accent);letter-spacing:.06em}
.tscript .you small{color:var(--night-muted)}
.callacts{display:flex;gap:10px;margin-top:22px}
.callacts button{flex:1;min-height:48px;border-radius:999px;border:0;font-weight:600}
.callacts .yes{background:#2E8B57;color:#FFFFFF}
.callacts .no{background:#B3392B;color:#FFFFFF}
.callacts .end{background:var(--night-line);color:var(--night-ink)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}

@media (max-width:1180px){
  .app{grid-template-columns:220px minmax(0,1fr)}
  .chat{grid-column:1 / -1;position:static;height:auto;border-left:0;border-top:1px solid var(--line)}
  .msgs{max-height:420px}
}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:0;z-index:20;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:10px max(16px,env(safe-area-inset-left,0px)) 10px max(16px,env(safe-area-inset-left,0px));padding-top:calc(10px + env(safe-area-inset-top,0px));border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px 0 0;font-size:20px}
  .biz,.rail .spacer,.demo-tag{display:none}
  .navbtn{width:auto;flex:none;white-space:nowrap}
  .navbtn span.lbl{display:none}
  .navbtn[aria-current="page"] span.lbl{display:inline}
  .main{padding:20px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
  .topbar h1{font-size:28px}
  .funnel .f{grid-template-columns:110px minmax(0,1fr) 56px}
}
@media (prefers-reduced-motion: reduce){.wave span{animation:none;height:60%}}
</style>

<div class="app">
  <aside class="rail" aria-label="Navegación">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
      Mano
    </div>
    <div class="biz"><b>Inmobiliaria Costa Azul</b><span>Mar del Plata · Plan Pro</span></div>
    <nav id="nav" style="display:contents"></nav>
    <div class="spacer"></div>
    <p class="demo-tag">Vista previa · datos de ejemplo</p>
  </aside>

  <main class="main" id="view" tabindex="-1"></main>

  <aside class="chat" aria-label="Conversación con Mano">
    <div class="chat-h">
      <div class="av" aria-hidden="true">M</div>
      <div><b>Mano</b><small>trabajando · 3 tareas en curso</small></div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <div class="quick" id="quick">
      <button type="button">¿Qué pasó hoy?</button>
      <button type="button">Cobrale a Gómez</button>
      <button type="button">Conseguime más leads</button>
      <button type="button">¿Cuánto gasté?</button>
    </div>
    <form class="compose" id="compose">
      <label for="chatInput" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Mensaje para Mano</label>
      <input id="chatInput" autocomplete="off" placeholder="Pedile algo a Mano…">
      <button type="submit" aria-label="Enviar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
  </aside>
</div>

<div class="overlay" id="call" role="dialog" aria-modal="true" aria-labelledby="callTitle" hidden>
  <div class="callbox">
    <div class="top"><span id="callState">Llamada entrante</span><span id="callTime">00:00</span></div>
    <h2 id="callTitle">Mano</h2>
    <p class="reason">Aviso crítico · Antifraude</p>
    <div class="wave" aria-hidden="true"><span style="animation-delay:-.1s"></span><span style="animation-delay:-.5s"></span><span style="animation-delay:-.3s"></span><span style="animation-delay:-.8s"></span><span style="animation-delay:-.2s"></span><span style="animation-delay:-.6s"></span><span style="animation-delay:-.9s"></span><span style="animation-delay:-.4s"></span><span style="animation-delay:-.7s"></span><span style="animation-delay:-.15s"></span><span style="animation-delay:-.55s"></span><span style="animation-delay:-.35s"></span></div>
    <div class="tscript" id="tscript"></div>
    <div class="callacts" id="callActs"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const money = (n) => '$' + n.toLocaleString('es-AR');
  const usd = (n) => 'USD ' + n.toFixed(n < 0.1 && n > 0 ? 3 : 2).replace('.', ',');

  const ICON = {
    home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
    check:'<path d="M20 6 9 17l-5-5"/>',

  let callIv, callSecs = 0;
  const LINES = [
    ['a', 'Hola Marta, te llamo por algo urgente. Llegó un mail de Corralón Norte pidiendo el pago de $420.000 a un CBU nuevo.'],
    ['a', 'Las últimas seis facturas fueron a otro CBU. Lo frené. ¿Querés que llame al número de siempre para confirmar?'],
    ['you', 'Sí, llamalos y no pagues hasta que confirmen.'],
    ['a', 'Hecho. Te aviso por WhatsApp cuando hable con ellos.']
  ];
  function openCall() {
    const o = $('#call'); o.hidden = false;
    $('#callState').textContent = 'Llamada entrante'; $('#callTime').textContent = '00:00'; $('#tscript').innerHTML = '';
    $('#callActs').innerHTML = '<button type="button" class="no" id="cNo">Rechazar</button><button type="button" class="yes" id="cYes">Atender</button>';
    $('#cYes').focus();
  }
  function closeCall() { $('#call').hidden = true; clearInterval(callIv); }
  $('#call').addEventListener('click', (e) => {
    if (e.target.id === 'cNo') { closeCall(); toast('Te lo mandé como nota de voz por WhatsApp'); }
    if (e.target.id === 'cEnd') { closeCall(); }
    if (e.target.id === 'cYes') {
      $('#callState').textContent = 'En llamada';
      $('#callActs').innerHTML = '<button type="button" class="end" id="cEnd">Cortar</button>';
      $('#cEnd').focus();
      callSecs = 0;
      callIv = setInterval(() => { callSecs++; $('#callTime').textContent = '00:' + String(callSecs).padStart(2, '0'); }, 1000);
      LINES.forEach(([w, t], i) => setTimeout(() => {
        if ($('#call').hidden) return;
        const d = document.createElement('div'); if (w === 'you') d.className = 'you';
        d.innerHTML = `<small>${w === 'you' ? 'VOS' : 'MANO'}</small>${esc(t)}`;
        $('#tscript').appendChild(d);
        if (i === LINES.length - 1) {
          const ap = S.approvals.find((x) => x.id === 'a3');
          if (ap) { S.approvals = S.approvals.filter((x) => x.id !== 'a3'); log('Antifraude', 'Pago retenido; llamando a Corralón Norte para confirmar el CBU', 'Llamada', 0.06, 'Vos, por teléfono'); render(); }
        }
      }, 700 + i * 1900));
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#call').hidden) closeCall(); });

  render();
})();
</script>
